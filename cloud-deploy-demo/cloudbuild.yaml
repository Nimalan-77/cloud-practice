steps:
  # 1. Build the Docker Image (Changed to SHORT_SHA)
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'cloud-deploy-demo'
    args: 
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/gke-repo/hello-app:$SHORT_SHA'
      - '.'

  # 2. Push the Docker Image to Artifact Registry (Changed to SHORT_SHA)
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'cloud-deploy-demo'
    args: 
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/gke-repo/hello-app:$SHORT_SHA'

  # 3. Apply the Cloud Deploy config
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'cloud-deploy-demo'
    entrypoint: gcloud
    args:
      - 'deploy'
      - 'apply'
      - '--file=clouddeploy.yaml'
      - '--region=asia-south1'
      - '--project=$PROJECT_ID'

  # 4. Create a Release in Cloud Deploy (Changed to rel-$SHORT_SHA)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'cloud-deploy-demo'
    entrypoint: gcloud
    args:
      - 'deploy'
      - 'releases'
      - 'create'
      - 'rel-$SHORT_SHA'
      - '--delivery-pipeline=gke-demo-pipeline'
      - '--region=asia-south1'
      - '--images=my-app-image=asia-south1-docker.pkg.dev/$PROJECT_ID/gke-repo/hello-app:$SHORT_SHA'



options:
 logging: CLOUD_LOGGING_ONLY